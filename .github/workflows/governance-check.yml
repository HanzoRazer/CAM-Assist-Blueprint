name: Governance check

# Pilot verifier. A green run is not branch protection and not an
# implementation authorization. This workflow checks out the pull request
# and is not the protected production gate. That gate is
# governance-trusted.yml, and only after an administrator deploys it.

on:
  pull_request:
    paths:
      - "governance/**"
      - "scripts/governance/**"
      - "tests/governance/**"
      - ".github/workflows/governance-check.yml"
      - ".github/workflows/governance-trusted.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "scripts/governance/**"
      - "tests/governance/**"
      - ".github/workflows/governance-check.yml"
      - ".github/workflows/governance-trusted.yml"

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements/governance-check.txt

      - name: Governance tests
        run: python -m pytest tests/governance -q

      - name: PEP-CAM-CONTRACT-002 remains blocked
        # actions/runner invokes this step as `bash -e`. The report exits 1
        # when the interchange stays blocked, so errexit must be off only
        # while that status is captured. This checkout is the candidate tree,
        # not a protected trust root outside the pull request.
        run: |
          set +e
          set -uo pipefail
          python scripts/governance/report_governance.py > "$RUNNER_TEMP/governance-report.json"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected blocked exit 1, got $code"
            cat "$RUNNER_TEMP/governance-report.json"
            exit 1
          fi
          python - << 'PY'
          import json, os
          body = json.load(open(os.environ["RUNNER_TEMP"] + "/governance-report.json"))
          assert body["production_authorization_operational"] is False
          assert body["interchange_r2"]["verdict"] == "BLOCKED"
          assert body["interchange_r2"]["code"] == 1
          assert body["trust_root"]["established"] is False
          assert body["trust_root"]["candidate_worktree_is_trust_root"] is False
          assert body["evidence_verification"]["live_github"] is False
          PY
