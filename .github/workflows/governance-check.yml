name: Governance check

# Pilot verifier. A green run is not branch protection and not an
# implementation authorization. Required-check status is reported outside
# this file because this workflow cannot see repository rules.

on:
  pull_request:
    paths:
      - "governance/**"
      - "scripts/governance/**"
      - "tests/governance/**"
      - ".github/workflows/governance-check.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "scripts/governance/**"
      - "tests/governance/**"
      - ".github/workflows/governance-check.yml"

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest jsonschema

      - name: Governance tests
        run: python -m pytest tests/governance -q

      - name: PEP-CAM-CONTRACT-002 remains blocked
        # actions/runner invokes this step as `bash -e`. The report exits 1
        # when the interchange stays blocked, so errexit must be off only
        # while that status is captured. This checkout is the candidate tree,
        # not a protected trust root outside the pull request.
        run: |
          set +e
          set -uo pipefail
          python scripts/governance/report_governance.py > "$RUNNER_TEMP/governance-report.json"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected blocked exit 1, got $code"
            cat "$RUNNER_TEMP/governance-report.json"
            exit 1
          fi
          python - << 'PY'
          import json, os
          body = json.load(open(os.environ["RUNNER_TEMP"] + "/governance-report.json"))
          assert body["production_authorization_operational"] is False
          assert body["interchange_r2"]["verdict"] == "BLOCKED"
          assert body["interchange_r2"]["code"] == 1
          PY
