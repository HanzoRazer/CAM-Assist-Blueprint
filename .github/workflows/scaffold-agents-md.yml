name: Scaffold AGENTS.md

# Witnessed CI for scripts/scaffold_agents_md.py (SCAFFOLD-DIST-001).
# Runs against real temporary Git repositories; does not mock Git or stdin.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/scaffold_agents_md.py'
      - 'tests/test_scaffold_agents_md.py'
      - '.github/workflows/scaffold-agents-md.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/scaffold_agents_md.py'
      - 'tests/test_scaffold_agents_md.py'
      - '.github/workflows/scaffold-agents-md.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run SCAFFOLD-DIST-001
        run: python -m pytest tests/test_scaffold_agents_md.py -v
