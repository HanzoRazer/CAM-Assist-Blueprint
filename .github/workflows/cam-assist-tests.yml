name: CAM Assist Tests

# Witnessed CI for the CAM-Assist-Blueprint project.
#
# This repository is a monorepo: the project lives under CAM-Assist-Blueprint/
# (alongside an unrelated app/). GitHub Actions only executes workflows at the
# repository root .github/workflows/, so this file MUST live here — not under
# CAM-Assist-Blueprint/.github/, where it would never trigger.
#
# Scoped to CAM Assist only: path filters and working-directory keep this
# green/red signal about CAM-Assist-Blueprint and never run on app/ changes.

on:
  pull_request:
    branches: [main]
    paths:
      - 'CAM-Assist-Blueprint/**'
      - '.github/workflows/cam-assist-tests.yml'
  push:
    branches: [main]
    paths:
      - 'CAM-Assist-Blueprint/**'
      - '.github/workflows/cam-assist-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CAM-Assist-Blueprint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pytest is required. jsonschema is optional locally (schema-apply tests
        # use importorskip) and is installed here so CI actually applies the
        # schemas instead of skipping those guards.
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Run test suite
        run: python -m pytest

      - name: Verify non-execution invariant
        run: python scripts/ci_verify_non_execution_invariant.py

      - name: Validate canonical creation studio capability map
        run: python scripts/validate_creation_studio_capability_map.py contracts/creation_studio_capability_map.json

      - name: Verify committed creation studio requests (references resolve)
        # Structural validity is not enough for a committed artifact: its declared
        # references must actually resolve. --check-references is existence-only and
        # --fail-on-reference-warnings promotes any unresolved reference to a failure,
        # so a request that points at a missing/renamed/moved file breaks the build.
        run: |
          shopt -s nullglob globstar
          files=(examples/**/creation_studio/*_request.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No committed creation studio requests found"
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "Validating $f"
            python scripts/validate_creation_studio_request.py "$f" \
              --check-references --fail-on-reference-warnings || status=1
          done
          exit $status
