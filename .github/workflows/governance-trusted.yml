name: Governance trusted evaluation

# This file becomes executable only after it is on the default branch.
# pull_request_target loads the workflow from that base branch. The job
# checks out the same base SHA and does not run candidate scripts.
# A green run means the fail-closed report was produced. It does not
# authorize implementation, and it is not a required check until an
# administrator confirms deployment.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-trusted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: python -m pip install jsonschema

      - name: Evaluate from the base commit
        env:
          GOVERNANCE_TRUST_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python scripts/governance/report_governance.py > "$RUNNER_TEMP/governance-report.json"
          code=$?
          set -e
          python - << 'PY'
          import json, os, sys
          body = json.load(open(os.environ["RUNNER_TEMP"] + "/governance-report.json"))
          if body.get("production_authorization_operational") is not False:
              sys.exit("production authorization must stay disabled")
          interchange = body.get("interchange_r2") or {}
          if interchange.get("verdict") != "BLOCKED":
              sys.exit("interchange R2 must stay blocked")
          trust = body.get("trust_root") or {}
          if trust.get("candidate_worktree_is_trust_root") is not False:
              sys.exit("candidate checkout cannot be the trust root")
          if trust.get("established") is not False:
              sys.exit("this job must not claim an established production trust root")
          PY
          if [ "$code" -eq 4 ]; then
            echo "verifier error"
            cat "$RUNNER_TEMP/governance-report.json"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "authorized verdict is not valid for this pilot"
            exit 1
          fi
